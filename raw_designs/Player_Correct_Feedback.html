<style>
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#ffffff', '#79ff5b', '#0f6d00', '#d7ffc5'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                
                // Random position
                const startX = Math.random() * 100;
                const startY = Math.random() * 100;
                
                // Random size
                const size = Math.random() * 8 + 4;
                
                confetti.style.left = startX + 'vw';
                confetti.style.top = startY + 'vh';
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                
                // Animation settings
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 0.5;
                
                confetti.style.transition = `all ${duration}s cubic-bezier(0.25, 0.46, 0.45, 0.94) ${delay}s`;
                
                container.appendChild(confetti);
                
                // Force a reflow and then animate
                setTimeout(() => {
                    confetti.style.transform = `translate(${(Math.random() - 0.5) * 200}px, ${Math.random() * 300 + 100}px) rotate(${Math.random() * 360}deg)`;
                    confetti.style.opacity = '0';
                }, 10);
            }
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', () => {
            createConfetti();
            
            // Re-trigger every 3 seconds for loop excitement
            setInterval(createConfetti, 4000);
        });

        // Trigger scale animation on the score for "counting" effect
        const scoreElement = document.querySelector('.font-headline-md');
        setTimeout(() => {
            scoreElement.classList.add('scale-110', 'transition-transform');
            setTimeout(() => scoreElement.classList.remove('scale-110'), 200);
        }, 800);
    </script>


</body></html>

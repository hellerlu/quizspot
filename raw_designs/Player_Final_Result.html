<script>
        // Interactive Celebration Effect
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#adc7ff', '#79ff5b', '#d7ffc5', '#4a8eff'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.top = '-10px';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 5;
                
                confetti.style.transition = `top ${duration}s linear ${delay}s, left ${duration}s ease-in-out ${delay}s, opacity ${duration}s ease-in-out ${delay}s`;
                
                container.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.style.top = '100vh';
                    confetti.style.left = (parseFloat(confetti.style.left) + (Math.random() * 20 - 10)) + 'vw';
                    confetti.style.opacity = '0';
                }, 100);
                
                setTimeout(() => {
                    confetti.remove();
                }, (duration + delay) * 1000);
            }
        }

        // Run celebration on load
        window.onload = () => {
            createConfetti();
            setInterval(createConfetti, 4000);
        };

        function triggerPlayAgain() {
            console.log("Navigating back to lobby...");
            // Visual feedback
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="flex items-center gap-base"><span class="material-symbols-outlined animate-spin" data-icon="autorenew">autorenew</span>Connecting...</span>';
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        }
    </script>

<script>
        // Micro-interaction for the start button
        const startBtn = document.getElementById('startBtn');
        startBtn.addEventListener('click', () => {
            const ripple = document.createElement('div');
            ripple.classList.add('absolute', 'inset-0', 'bg-white/20', 'animate-ping');
            startBtn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 1000);
        });

        // Add some "waiting" animation logic to status dots
        document.querySelectorAll('.bg-secondary-fixed.shadow-\\[0_0_8px_rgba\\(121\\,255\\,91\\,1\\)\\]').forEach((dot, index) => {
            dot.style.animationDelay = `${index * 0.2}s`;

<script>
        // Simple Countdown Interaction
        let timeLeft = 15;
        const countdownEl = document.getElementById('countdown-text');
        const ringEl = document.getElementById('timer-ring');
        const totalOffset = 176; // Circumference of the new smaller circle (2 * PI * 28)

        const timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timeLeft = 0;
            }
            
            countdownEl.textContent = timeLeft;
            
            // Update Ring Offset
            const progress = timeLeft / 15;
            const offset = totalOffset * progress;
            ringEl.style.strokeDashoffset = totalOffset - offset;

            // Change color as it gets urgent
            if (timeLeft <= 5) {
                ringEl.classList.remove('text-secondary-fixed');
                ringEl.classList.add('text-error');
                countdownEl.classList.add('text-error');
                document.documentElement.style.setProperty('--timer-color', '#ffb4ab');
            }
        }, 1000);

        // Subtle parallax or hover effect for cards
        document.querySelectorAll('.glass-panel').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        });
    </script>

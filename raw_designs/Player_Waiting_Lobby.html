<style>
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(173, 199, 255, 0.4)); }
            50% { filter: drop-shadow(0 0 30px rgba(173, 199, 255, 0.8)); }
        }
        @keyframes rotate-quiz {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-pulse-glow { animation: pulse-glow 3s ease-in-out infinite; }
        .animate-rotate-quiz { animation: rotate-quiz 12s linear infinite; }
        .animate-float { animation: float 4s ease-in-out infinite; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- Top App Bar (Suppressing Navigation for Transactional Screen) -->
<header class="fixed top-0 w-full z-50 bg-surface/10 backdrop-blur-xl border-b border-white/10 flex justify-between items-center px-gutter-mobile py-sm">
<h1 class="font-display-mobile text-display-mobile text-primary tracking-tighter italic">QuizSpot</h1>
<div class="rounded-full bg-primary-container flex items-center justify-center text-on-primary-container w-8 h-8">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-gutter-mobile pt-xl pb-md relative">
<!-- Atmospheric Background Elements -->
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-secondary-fixed/5 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Center Content Group -->
<div class="z-10 text-center space-y-lg animate-float">
<!-- Rotating Icon Animation -->
<div class="relative inline-block">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-2xl animate-pulse-glow"></div>
<div class="w-48 h-48 md:w-64 md:h-64 rounded-full glass-panel flex items-center justify-center relative border-primary/30">
<span class="material-symbols-outlined text-[80px] md:text-[120px] text-primary animate-rotate-quiz" data-icon="quiz">quiz</span>
</div>
</div>
<!-- Status Text -->
<div class="space-y-sm">
<h2 class="font-display-mobile text-display-mobile md:font-display-tv md:text-display-tv text-primary animate-pulse tracking-tight">Connected!</h2>
<p class="font-body-lg text-body-lg text-outline-variant">Waiting for host to start...</p>
</div>
</div>
<!-- Player Nickname Chip (Bottom Anchor) -->
<div class="mt-auto mb-xl z-10">
<div class="glass-panel px-lg py-sm rounded-full flex items-center gap-sm shadow-2xl border-secondary-fixed/20">
<div class="w-12 h-12 bg-secondary-fixed rounded-full flex items-center justify-center text-on-secondary-fixed shadow-[0_0_15px_rgba(121,255,91,0.4)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">face</span>
</div>
<div class="flex flex-col text-left">
<span class="font-label-bold text-label-bold text-secondary-fixed">Alex</span>
<span class="text-[10px] uppercase tracking-widest text-outline-variant font-bold">Player Connected</span>
</div>
</div>
</div>
<!-- Footer Decoration / Lobby Stats -->
<div class="fixed bottom-gutter-mobile left-0 w-full flex justify-center px-gutter-mobile pointer-events-none">
<div class="flex gap-md opacity-40">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">group</span>
<span class="font-label-bold text-xs">12 / 20</span>
</div>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">wifi</span>
<span class="font-label-bold text-xs">Ping: 24ms</span>
</div>
</div>
</div>
</main>
<!-- Interactive Atmospheric Micro-interaction Script -->
<script>
        // Subtle mouse/tilt movement for the float effect
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            const floatElement = document.querySelector('.animate-float');
            if (floatElement) {
                floatElement.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Simulating lobby connection "ticks"
        setInterval(() => {
            console.log("Maintaining socket connection for player: Alex");
        }, 5000);
    </script>


</body></html>

<!-- Confetti Script -->
<script>
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let pieces = [];
        const numberOfPieces = 250;
        const colors = ['#adc7ff', '#79ff5b', '#ffd700', '#c0c0c0', '#cd7f32', '#4a8eff'];

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (pieces.length < numberOfPieces) {
                pieces.push(new Piece());
            }

            pieces.forEach((p, i) => {
                p.y += p.gravity;
                p.x += p.drift;
                p.rotation += p.rotationSpeed;

                if (p.y > canvas.height) {
                    pieces[i] = new Piece();
                    pieces[i].y = -20;
                }

                ctx.save();
                ctx.fillStyle = p.color;
                ctx.translate(p.x + p.width / 2, p.y + p.height / 2);
                ctx.rotate(p.rotation);
                ctx.fillRect(-p.width / 2, -p.height / 2, p.width, p.height);
                ctx.restore();
            });

            requestAnimationFrame(update);
        }

        class Piece {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
                this.width = Math.random() * 12 + 8;
                this.height = Math.random() * 12 + 8;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.gravity = Math.random() * 1.5 + 2;
                this.drift = (Math.random() - 0.5) * 2;
            }
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        update();
    </script>

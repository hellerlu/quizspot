<script>
        function handlePress(color) {
            // Haptic-like interaction feedback
            const overlay = document.getElementById('feedback-overlay');
            const icon = document.getElementById('feedback-icon');
            
            // Map colors to visual symbols for feedback
            const icons = {
                'red': 'change_history',
                'blue': 'pentagon',
                'yellow': 'circle',
                'green': 'square'
            };

            icon.innerText = icons[color];
            overlay.classList.remove('opacity-0');
            overlay.classList.add('opacity-100');
            
            // Temporary glow intensity
            document.body.style.backgroundColor = `var(--tw-color-${color}-900)`;
            
            setTimeout(() => {
                overlay.classList.remove('opacity-100');
                overlay.classList.add('opacity-0');
                document.body.style.backgroundColor = '';
            }, 300);

            // Audio feedback placeholder
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, context.currentTime);
                gain.gain.setValueAtTime(0.1, context.currentTime);
                oscillator.connect(gain);
                gain.connect(context.destination);
                oscillator.start();
                oscillator.stop(context.currentTime + 0.05);
            } catch(e) {}
        }

        // Prevent accidental scrolling/bouncing on mobile
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('main')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>

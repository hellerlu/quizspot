<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 700, 'GRAD' 0, 'opsz' 48;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake-impact {
            animation: shake 0.2s ease-in-out 0s 2;
        }
        .vignette-error {
            background: radial-gradient(circle, transparent 40%, rgba(147, 0, 10, 0.4) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-error-container text-on-error-container min-h-screen flex flex-col items-center justify-between overflow-hidden">
<!-- Top App Bar (Suppressed because this is a Focused Transactional State, but UI rules suggest if it's top-level navigation it might show. Here we prioritize the high-impact canvas) -->
<!-- Background Impact Effect -->
<div class="fixed inset-0 vignette-error pointer-events-none"></div>
<!-- Main Feedback Canvas -->
<main class="flex-1 flex flex-col items-center justify-center w-full px-gutter-mobile z-10 text-center">
<!-- Massive Icon Wrapper -->
<div class="mb-lg shake-impact">
<div class="w-32 h-32 md:w-48 md:h-48 rounded-full border-8 border-on-error-container flex items-center justify-center animate-pulse">
<span class="material-symbols-outlined text-[80px] md:text-[120px] text-on-error-container" style="font-variation-settings: 'FILL' 0;">close</span>
</div>
</div>
<!-- High Impact Typography -->
<h1 class="font-display-mobile text-display-mobile md:font-display-tv md:text-display-tv tracking-tighter mb-sm uppercase">
            INCORRECT!
        </h1>
<!-- Contextual Info Card (Glassmorphism) -->
<div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-xl px-lg py-md w-full max-w-sm mt-md shadow-2xl">
<p class="font-label-bold text-label-bold text-on-error-container/80 mb-xs uppercase tracking-widest">Current Score</p>
<p class="font-headline-sm text-headline-sm-mobile md:text-headline-sm font-bold">
                4,500
            </p>
</div>
<!-- Correct Answer Reveal (Secondary Info) -->
<div class="mt-lg opacity-80">
<p class="font-body-md text-body-md italic">
                The correct answer was: <span class="font-bold">Tokyo</span>
</p>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="w-full px-gutter-mobile pb-xl z-10 flex flex-col gap-md items-center">
<!-- Encouragement / Streak Status -->
<div class="flex items-center gap-sm bg-black/20 px-md py-sm rounded-full">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">heart_broken</span>
<span class="font-label-bold text-label-bold">Streak Ended!</span>
</div>
<!-- Wait for next question or manual skip -->
<div class="w-full max-w-xs h-2 bg-on-error-container/20 rounded-full overflow-hidden">
<div class="h-full bg-on-error-container w-full origin-left animate-[shrink_5s_linear_forwards]"></div>
</div>
<p class="font-label-bold text-label-bold opacity-60">Waiting for next question...</p>
</footer>
<style>
        @keyframes shrink {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }
    </style>
<!-- Background Atmospheric Image -->
<div class="fixed inset-0 -z-10 opacity-30">

</div>
<!-- Micro-interaction Script -->
<script>
        // Simple haptic-like visual feedback or timed redirect simulation
        document.addEventListener('DOMContentLoaded', () => {
            // Trigger a minor "thud" scale on the score card after a delay
            setTimeout(() => {
                const card = document.querySelector('.bg-white\\/10');
                if(card) {
                    card.classList.add('scale-105');
                    setTimeout(() => card.classList.remove('scale-105'), 150);
                }
            }, 500);
        });
    </script>

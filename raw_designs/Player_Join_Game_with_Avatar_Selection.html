<!-- Interaction Script -->
<script>
        const nicknameInput = document.getElementById('nickname');
        const joinButton = document.getElementById('join-button');

        // Simple button activation feedback
        nicknameInput.addEventListener('input', (e) => {
            if (e.target.value.trim().length >= 3) {
                joinButton.classList.remove('opacity-50', 'grayscale');
                joinButton.classList.add('neon-glow-blue');
            } else {
                joinButton.classList.add('opacity-50', 'grayscale');
                joinButton.classList.remove('neon-glow-blue');
            }
        });

        // Trigger pulse on join attempt
        joinButton.addEventListener('click', () => {
            const val = nicknameInput.value.trim();
            if (val) {
                joinButton.innerHTML = `
                    <span class="material-symbols-outlined animate-spin">progress_activity</span>
                    <span>JOINING...</span>
                `;
                joinButton.disabled = true;
                setTimeout(() => {
                    // Simulating transition
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.5s ease-out';
                }, 800);
            } else {
                nicknameInput.classList.add('border-error');
                setTimeout(() => nicknameInput.classList.remove('border-error'), 500);
            }
        });
    </script>
